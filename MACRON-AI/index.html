<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureAssess Pro - Advanced Security Platform</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide-react@0.263.1/dist/esm/lucide-react.js" type="module"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Satoshi:wght@300;400;500;600;700;900&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --gradient-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --gradient-success: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --gradient-warning: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            --gradient-danger: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
            --shadow-glass: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            --backdrop-filter: blur(4px);
        }

        * {
            font-family: 'Satoshi', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .mono {
            font-family: 'JetBrains Mono', monospace;
        }

        .glass {
            background: rgba(255, 255, 255, 0.25);
            box-shadow: var(--shadow-glass);
            backdrop-filter: var(--backdrop-filter);
            -webkit-backdrop-filter: var(--backdrop-filter);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        .gradient-primary {
            background: var(--gradient-primary);
        }

        .gradient-success {
            background: var(--gradient-success);
        }

        .gradient-warning {
            background: var(--gradient-warning);
        }

        .gradient-danger {
            background: var(--gradient-danger);
        }

        .floating {
            animation: floating 6s ease-in-out infinite;
        }

        @keyframes floating {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        .slide-in {
            animation: slideIn 0.5s ease-out forwards;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .status-badge {
            position: relative;
            overflow: hidden;
        }

        .status-badge::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }

        .status-badge:hover::before {
            left: 100%;
        }

        .glow {
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.4);
        }

        .progress-ring {
            transform: rotate(-90deg);
        }

        .progress-ring circle {
            transition: stroke-dashoffset 0.5s ease-in-out;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #6B73FF 100%);
            min-height: 100vh;
        }

        .nav-item {
            position: relative;
            transition: all 0.3s ease;
        }

        .nav-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 3px;
            background: var(--gradient-primary);
            transform: scaleY(0);
            transition: transform 0.3s ease;
        }

        .nav-item.active::before {
            transform: scaleY(1);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Icons using inline SVG for compatibility
        const Shield = ({ className = "w-6 h-6" }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
            </svg>
        );

        const Upload = ({ className = "w-6 h-6" }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
            </svg>
        );

        const FileText = ({ className = "w-6 h-6" }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
            </svg>
        );

        const Search = ({ className = "w-6 h-6" }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
        );

        const Users = ({ className = "w-6 h-6" }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197m13.5-9a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
        );

        const AlertTriangle = ({ className = "w-6 h-6" }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.732-.833-2.502 0L4.268 18.5c-.77.833.192 2.5 1.732 2.5z" />
            </svg>
        );

        const Bot = ({ className = "w-6 h-6" }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
            </svg>
        );

        const Clock = ({ className = "w-6 h-6" }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        );

        const CheckCircle = ({ className = "w-6 h-6" }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        );

        const User = ({ className = "w-6 h-6" }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
        );

        const TrendingUp = ({ className = "w-6 h-6" }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
            </svg>
        );

        const Bell = ({ className = "w-6 h-6" }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 17h5l-5 5-5-5h5V7a5 5 0 015 5v5z" />
            </svg>
        );

        const Plus = ({ className = "w-6 h-6" }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
            </svg>
        );

        const Eye = ({ className = "w-6 h-6" }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
        );

        // Request Status Component
        const RequestStatus = ({ assessments = [], setAssessments }) => {
            const [requests, setRequests] = useState([
                {
                    id: 'REQ-001',
                    title: 'Security Assessment - TechCorp Partnership',
                    type: 'Security Assessment',
                    status: 'pending',
                    priority: 'high',
                    submittedBy: 'John Smith',
                    submittedAt: new Date('2024-12-08T10:00:00'),
                    lastUpdated: new Date('2024-12-08T14:30:00'),
                    description: 'Complete security assessment for new technology partnership with TechCorp including infrastructure review and compliance verification.',
                    assignee: 'Security Team Alpha',
                    estimatedCompletion: new Date('2024-12-12T17:00:00'),
                    attachments: ['security-requirements.pdf', 'network-diagram.png']
                },
                {
                    id: 'REQ-002', 
                    title: 'Background Check - New CISO Candidate',
                    type: 'Background Check',
                    status: 'in-progress',
                    priority: 'medium',
                    submittedBy: 'HR Department',
                    submittedAt: new Date('2024-12-07T09:15:00'),
                    lastUpdated: new Date('2024-12-08T11:20:00'),
                    description: 'Comprehensive background verification for Chief Information Security Officer candidate including previous employment and security clearance verification.',
                    assignee: 'Background Check Team',
                    estimatedCompletion: new Date('2024-12-10T16:00:00'),
                    progress: 65
                },
                {
                    id: 'REQ-003',
                    title: 'Domain Security Scan - subsidiary-corp.com',
                    type: 'Domain Scan',
                    status: 'completed',
                    priority: 'low',
                    submittedBy: 'Network Admin',
                    submittedAt: new Date('2024-12-05T14:00:00'),
                    lastUpdated: new Date('2024-12-06T10:30:00'),
                    description: 'Security vulnerability scan of subsidiary domain including SSL certificate verification and penetration testing.',
                    assignee: 'Security Scan Bot',
                    completedAt: new Date('2024-12-06T10:30:00'),
                    results: 'No critical vulnerabilities found. 2 medium-priority issues resolved.'
                }
            ]);

            const [selectedRequest, setSelectedRequest] = useState(null);
            const [showNewRequestForm, setShowNewRequestForm] = useState(false);
            const [newRequest, setNewRequest] = useState({
                title: '',
                type: 'Security Assessment',
                priority: 'medium',
                description: ''
            });

            const getStatusColor = (status) => {
                switch (status) {
                    case 'pending': return 'bg-yellow-500';
                    case 'in-progress': return 'bg-blue-500';
                    case 'completed': return 'bg-green-500';
                    case 'rejected': return 'bg-red-500';
                    default: return 'bg-gray-500';
                }
            };

            const getPriorityColor = (priority) => {
                switch (priority) {
                    case 'high': return 'text-red-600 bg-red-50';
                    case 'medium': return 'text-yellow-600 bg-yellow-50';
                    case 'low': return 'text-green-600 bg-green-50';
                    default: return 'text-gray-600 bg-gray-50';
                }
            };

            const handleSubmitRequest = (e) => {
                e.preventDefault();
                const request = {
                    id: `REQ-${String(requests.length + 1).padStart(3, '0')}`,
                    ...newRequest,
                    status: 'pending',
                    submittedBy: 'Current User',
                    submittedAt: new Date(),
                    lastUpdated: new Date(),
                    assignee: 'Auto-assigned'
                };
                setRequests([...requests, request]);
                setNewRequest({ title: '', type: 'Security Assessment', priority: 'medium', description: '' });
                setShowNewRequestForm(false);
            };

            const ProgressRing = ({ progress }) => {
                const radius = 20;
                const circumference = 2 * Math.PI * radius;
                const strokeDashoffset = circumference - (progress / 100) * circumference;

                return (
                    <div className="relative w-12 h-12">
                        <svg className="progress-ring w-12 h-12" width="48" height="48">
                            <circle
                                cx="24" cy="24" r={radius}
                                stroke="rgba(255,255,255,0.2)"
                                strokeWidth="3"
                                fill="transparent"
                            />
                            <circle
                                cx="24" cy="24" r={radius}
                                stroke="white"
                                strokeWidth="3"
                                fill="transparent"
                                strokeDasharray={circumference}
                                strokeDashoffset={strokeDashoffset}
                            />
                        </svg>
                        <div className="absolute inset-0 flex items-center justify-center">
                            <span className="text-xs font-semibold text-white">{progress}%</span>
                        </div>
                    </div>
                );
            };

            return (
                <div className="space-y-6">
                    <div className="flex items-center justify-between">
                        <div>
                            <h2 className="text-3xl font-bold text-white mb-2">Request Status</h2>
                            <p className="text-white/80">Track and manage security assessment requests</p>
                        </div>
                        <button
                            onClick={() => setShowNewRequestForm(true)}
                            className="glass text-white px-6 py-3 rounded-xl flex items-center gap-2 hover:bg-white/30 transition-all duration-300 glow"
                        >
                            <Plus className="w-5 h-5" />
                            New Request
                        </button>
                    </div>

                    {/* Stats Cards */}
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                        {[
                            { label: 'Total Requests', value: requests.length, color: 'gradient-primary', icon: FileText },
                            { label: 'Pending', value: requests.filter(r => r.status === 'pending').length, color: 'gradient-warning', icon: Clock },
                            { label: 'In Progress', value: requests.filter(r => r.status === 'in-progress').length, color: 'gradient-success', icon: TrendingUp },
                            { label: 'Completed', value: requests.filter(r => r.status === 'completed').length, color: 'gradient-success', icon: CheckCircle }
                        ].map((stat, index) => {
                            const Icon = stat.icon;
                            return (
                                <div key={index} className={`glass p-6 rounded-2xl text-white slide-in`} style={{animationDelay: `${index * 0.1}s`}}>
                                    <div className="flex items-center justify-between">
                                        <div>
                                            <p className="text-white/80 text-sm font-medium">{stat.label}</p>
                                            <p className="text-3xl font-bold mt-2">{stat.value}</p>
                                        </div>
                                        <div className={`w-14 h-14 ${stat.color} rounded-xl flex items-center justify-center floating`}>
                                            <Icon className="w-7 h-7" />
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>

                    {/* Requests List */}
                    <div className="glass rounded-2xl p-6">
                        <h3 className="text-xl font-bold text-white mb-6">Active Requests</h3>
                        <div className="space-y-4">
                            {requests.map((request) => (
                                <div key={request.id} className="glass p-5 rounded-xl hover:bg-white/30 transition-all duration-300 cursor-pointer"
                                     onClick={() => setSelectedRequest(request)}>
                                    <div className="flex items-center justify-between">
                                        <div className="flex-1">
                                            <div className="flex items-center gap-3 mb-2">
                                                <span className="mono text-sm text-white/80 font-semibold">{request.id}</span>
                                                <span className={`px-3 py-1 rounded-full text-xs font-semibold ${getPriorityColor(request.priority)}`}>
                                                    {request.priority.toUpperCase()}
                                                </span>
                                                <div className="flex items-center gap-2">
                                                    <div className={`w-3 h-3 rounded-full ${getStatusColor(request.status)}`}></div>
                                                    <span className="text-white/80 text-sm capitalize">{request.status.replace('-', ' ')}</span>
                                                </div>
                                            </div>
                                            <h4 className="text-white font-semibold text-lg mb-1">{request.title}</h4>
                                            <p className="text-white/70 text-sm mb-2">{request.description}</p>
                                            <div className="flex items-center gap-4 text-xs text-white/60">
                                                <span>Submitted by {request.submittedBy}</span>
                                                <span>•</span>
                                                <span>{request.submittedAt.toLocaleDateString()}</span>
                                                <span>•</span>
                                                <span>Assigned to {request.assignee}</span>
                                            </div>
                                        </div>
                                        <div className="flex items-center gap-4">
                                            {request.status === 'in-progress' && request.progress && (
                                                <ProgressRing progress={request.progress} />
                                            )}
                                            <Eye className="w-5 h-5 text-white/60" />
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* New Request Modal */}
                    {showNewRequestForm && (
                        <div className="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="glass rounded-2xl p-8 max-w-2xl w-full max-h-[90vh] overflow-y-auto">
                                <h3 className="text-2xl font-bold text-white mb-6">Create New Request</h3>
                                <form onSubmit={handleSubmitRequest} className="space-y-6">
                                    <div>
                                        <label className="block text-white/80 text-sm font-medium mb-2">Request Title</label>
                                        <input
                                            type="text"
                                            value={newRequest.title}
                                            onChange={(e) => setNewRequest({...newRequest, title: e.target.value})}
                                            className="w-full px-4 py-3 bg-white/20 border border-white/30 rounded-xl text-white placeholder-white/60 focus:outline-none focus:border-white/60"
                                            placeholder="Enter request title"
                                            required
                                        />
                                    </div>
                                    
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-white/80 text-sm font-medium mb-2">Request Type</label>
                                            <select
                                                value={newRequest.type}
                                                onChange={(e) => setNewRequest({...newRequest, type: e.target.value})}
                                                className="w-full px-4 py-3 bg-white/20 border border-white/30 rounded-xl text-white focus:outline-none focus:border-white/60"
                                            >
                                                <option value="Security Assessment">Security Assessment</option>
                                                <option value="Background Check">Background Check</option>
                                                <option value="Domain Scan">Domain Scan</option>
                                                <option value="Vulnerability Scan">Vulnerability Scan</option>
                                                <option value="Compliance Review">Compliance Review</option>
                                            </select>
                                        </div>
                                        
                                        <div>
                                            <label className="block text-white/80 text-sm font-medium mb-2">Priority</label>
                                            <select
                                                value={newRequest.priority}
                                                onChange={(e) => setNewRequest({...newRequest, priority: e.target.value})}
                                                className="w-full px-4 py-3 bg-white/20 border border-white/30 rounded-xl text-white focus:outline-none focus:border-white/60"
                                            >
                                                <option value="low">Low</option>
                                                <option value="medium">Medium</option>
                                                <option value="high">High</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-white/80 text-sm font-medium mb-2">Description</label>
                                        <textarea
                                            value={newRequest.description}
                                            onChange={(e) => setNewRequest({...newRequest, description: e.target.value})}
                                            className="w-full px-4 py-3 bg-white/20 border border-white/30 rounded-xl text-white placeholder-white/60 focus:outline-none focus:border-white/60 h-32 resize-none"
                                            placeholder="Detailed description of the security assessment request"
                                            required
                                        />
                                    </div>

                                    <div className="flex gap-4 pt-4">
                                        <button
                                            type="submit"
                                            className="flex-1 gradient-primary text-white px-6 py-3 rounded-xl font-semibold hover:shadow-lg transition-all duration-300"
                                        >
                                            Submit Request
                                        </button>
                                        <button
                                            type="button"
                                            onClick={() => setShowNewRequestForm(false)}
                                            className="px-6 py-3 border border-white/30 text-white rounded-xl font-semibold hover:bg-white/20 transition-all duration-300"
                                        >
                                            Cancel
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Request Details Modal */}
                    {selectedRequest && (
                        <div className="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="glass rounded-2xl p-8 max-w-4xl w-full max-h-[90vh] overflow-y-auto">
                                <div className="flex items-center justify-between mb-6">
                                    <div>
                                        <h3 className="text-2xl font-bold text-white">{selectedRequest.title}</h3>
                                        <p className="text-white/80 mono">{selectedRequest.id}</p>
                                    </div>
                                    <button
                                        onClick={() => setSelectedRequest(null)}
                                        className="text-white/60 hover:text-white"
                                    >
                                        ✕
                                    </button>
                                </div>

                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                                    <div className="space-y-6">
                                        <div>
                                            <h4 className="text-white font-semibold mb-3">Request Details</h4>
                                            <div className="space-y-3">
                                                <div className="flex justify-between">
                                                    <span className="text-white/70">Type:</span>
                                                    <span className="text-white">{selectedRequest.type}</span>
                                                </div>
                                                <div className="flex justify-between">
                                                    <span className="text-white/70">Status:</span>
                                                    <div className="flex items-center gap-2">
                                                        <div className={`w-2 h-2 rounded-full ${getStatusColor(selectedRequest.status)}`}></div>
                                                        <span className="text-white capitalize">{selectedRequest.status.replace('-', ' ')}</span>
                                                    </div>
                                                </div>
                                                <div className="flex justify-between">
                                                    <span className="text-white/70">Priority:</span>
                                                    <span className={`px-2 py-1 rounded text-xs ${getPriorityColor(selectedRequest.priority)}`}>
                                                        {selectedRequest.priority.toUpperCase()}
                                                    </span>
                                                </div>
                                                <div className="flex justify-between">
                                                    <span className="text-white/70">Submitted by:</span>
                                                    <span className="text-white">{selectedRequest.submittedBy}</span>
                                                </div>
                                                <div className="flex justify-between">
                                                    <span className="text-white/70">Assigned to:</span>
                                                    <span className="text-white">{selectedRequest.assignee}</span>
                                                </div>
                                            </div>
                                        </div>

                                        <div>
                                            <h4 className="text-white font-semibold mb-3">Description</h4>
                                            <p className="text-white/80 leading-relaxed">{selectedRequest.description}</p>
                                        </div>
                                    </div>

                                    <div className="space-y-6">
                                        <div>
                                            <h4 className="text-white font-semibold mb-3">Timeline</h4>
                                            <div className="space-y-3">
                                                <div className="flex justify-between">
                                                    <span className="text-white/70">Submitted:</span>
                                                    <span className="text-white mono text-sm">
                                                        {selectedRequest.submittedAt.toLocaleString()}
                                                    </span>
                                                </div>
                                                <div className="flex justify-between">
                                                    <span className="text-white/70">Last Updated:</span>
                                                    <span className="text-white mono text-sm">
                                                        {selectedRequest.lastUpdated.toLocaleString()}
                                                    </span>
                                                </div>
                                                {selectedRequest.estimatedCompletion && (
                                                    <div className="flex justify-between">
                                                        <span className="text-white/70">Est. Completion:</span>
                                                        <span className="text-white mono text-sm">
                                                            {selectedRequest.estimatedCompletion.toLocaleString()}
                                                        </span>
                                                    </div>
                                                )}
                                            </div>
                                        </div>

                                        {selectedRequest.status === 'in-progress' && selectedRequest.progress && (
                                            <div>
                                                <h4 className="text-white font-semibold mb-3">Progress</h4>
                                                <div className="flex items-center gap-4">
                                                    <div className="flex-1 bg-white/20 rounded-full h-3">
                                                        <div 
                                                            className="gradient-success h-3 rounded-full transition-all duration-500"
                                                            style={{ width: `${selectedRequest.progress}%` }}
                                                        ></div>
                                                    </div>
                                                    <span className="text-white font-semibold">{selectedRequest.progress}%</span>
                                                </div>
                                            </div>
                                        )}

                                        {selectedRequest.results && (
                                            <div>
                                                <h4 className="text-white font-semibold mb-3">Results</h4>
                                                <div className="glass p-4 rounded-xl">
                                                    <p className="text-white/80">{selectedRequest.results}</p>
                                                </div>
                                            </div>
                                        )}

                                        {selectedRequest.attachments && (
                                            <div>
                                                <h4 className="text-white font-semibold mb-3">Attachments</h4>
                                                <div className="space-y-2">
                                                    {selectedRequest.attachments.map((attachment, index) => (
                                                        <div key={index} className="flex items-center gap-3 glass p-3 rounded-lg">
                                                            <FileText className="w-4 h-4 text-white/60" />
                                                            <span className="text-white/80 text-sm">{attachment}</span>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // Header Component
        const Header = () => (
            <header className="glass border-b border-white/20">
                <div className="px-6 py-4">
                    <div className="flex items-center justify-between">
                        <div className="flex items-center gap-4">
                            <div className="flex items-center gap-3">
                                <div className="gradient-primary p-2 rounded-xl">
                                    <Shield className="w-7 h-7 text-white" />
                                </div>
                                <h1 className="text-2xl font-bold text-white">SecureAssess Pro</h1>
                            </div>
                            <div className="h-6 w-px bg-white/30"></div>
                            <span className="text-sm text-white/70">Advanced Security Assessment Platform</span>
                        </div>
                        
                        <div className="flex items-center gap-6">
                            <div className="flex items-center gap-2 text-sm text-white/70">
                                <Clock className="w-4 h-4" />
                                <span>Last scan: 2 hours ago</span>
                            </div>
                            
                            <div className="flex items-center gap-3">
                                <div className="gradient-primary w-8 h-8 rounded-full flex items-center justify-center">
                                    <User className="w-5 h-5 text-white" />
                                </div>
                                <div className="text-sm">
                                    <div className="font-medium text-white">Asaf - Security Analyst</div>
                                    <div className="text-white/70">asaf@secureassess.com</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </header>
        );

        // Main App Component
        const App = () => {
            const [activeTab, setActiveTab] = useState('request-status');
            const [assessments, setAssessments] = useState([]);

            const tabs = [
                { id: 'dashboard', label: 'Dashboard', icon: Shield },
                { id: 'request-status', label: 'Request Status', icon: Bell },
                { id: 'agent-chat', label: 'TPRM Agent', icon: Bot },
                { id: 'upload', label: 'Upload Documents', icon: Upload },
                { id: 'questionnaire', label: 'Security Assessment', icon: FileText },
                { id: 'domain-scan', label: 'Domain Scanner', icon: Search },
                { id: 'background-check', label: 'Background Check', icon: Users },
                { id: 'report', label: 'Security Report', icon: AlertTriangle },
            ];

            const renderContent = () => {
                switch (activeTab) {
                    case 'request-status':
                        return <RequestStatus assessments={assessments} setAssessments={setAssessments} />;
                    case 'dashboard':
                    default:
                        return (
                            <div className="space-y-6">
                                <div>
                                    <h2 className="text-3xl font-bold text-white mb-2">Security Dashboard</h2>
                                    <p className="text-white/80">Monitor and manage security assessments across your organization</p>
                                </div>
                                <div className="glass rounded-2xl p-8 text-center">
                                    <Shield className="w-16 h-16 text-white/60 mx-auto mb-4" />
                                    <h3 className="text-xl font-semibold text-white mb-2">Welcome to SecureAssess Pro</h3>
                                    <p className="text-white/70">Start by checking the Request Status or creating a new security assessment.</p>
                                </div>
                            </div>
                        );
                }
            };

            return (
                <div className="min-h-screen">
                    <Header />
                    
                    <div className="flex">
                        {/* Sidebar Navigation */}
                        <div className="w-64 glass h-screen sticky top-0 border-r border-white/20">
                            <div className="p-6">
                                <div className="flex items-center gap-3 mb-8">
                                    <div className="gradient-primary p-2 rounded-xl">
                                        <Shield className="w-6 h-6 text-white" />
                                    </div>
                                    <span className="text-xl font-bold text-white">Security Agent</span>
                                </div>
                                
                                <nav className="space-y-2">
                                    {tabs.map((tab) => {
                                        const Icon = tab.icon;
                                        return (
                                            <button
                                                key={tab.id}
                                                onClick={() => setActiveTab(tab.id)}
                                                className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-left transition-all duration-300 nav-item ${
                                                    activeTab === tab.id
                                                        ? 'bg-white/20 text-white shadow-lg active glow'
                                                        : 'text-white/70 hover:bg-white/10 hover:text-white'
                                                }`}
                                            >
                                                <Icon className="w-5 h-5" />
                                                <span className="font-medium">{tab.label}</span>
                                            </button>
                                        );
                                    })}
                                </nav>
                            </div>
                        </div>

                        {/* Main Content */}
                        <div className="flex-1 p-6">
                            {renderContent()}
                        </div>
                    </div>
                </div>
            );
        };

        // Render the app
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
